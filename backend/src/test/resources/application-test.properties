# ============================================================
# テスト用設定(プロファイル "test")
# ============================================================
# テストクラスに @ActiveProfiles("test") を付けた場合のみ読み込まれ、
# main側の application.properties の同名設定を上書きする(それ以外の設定はmain側をそのまま使う)。
#
# ※ src/test/resources/application.properties という名前にすると、main側の同名ファイル自体を
#   置き換えてしまい、SQLite/JPA等の共通設定が読み込まれなくなるため、プロファイル別ファイルとしている。

# 実際の学習データ(data/)を汚さないよう、テスト専用のSQLite DBを target/ 配下に作成する。
# target/ は mvnw clean で削除され、Git管理対象外でもある。
# SQLiteは親ディレクトリを自動作成しないため、テスト実行時に必ず存在する target/ 直下に置く。
# テーブルは main側の schema.sql(spring.sql.init.mode=always)によりテストDBにも作成される。
spring.datasource.url=jdbc:sqlite:target/japanese_expression_learning_test.db
