spring.application.name=japanese-learning

# ============================================================
# SQLite / DataSource 設定
# ============================================================
# DB設計書のDB名(japanese_expression_learning.db)に従い、backend/data/ 配下に保存する。
# 相対パスはアプリ起動時のカレントディレクトリ基準で解決されるため、
# backend/ をカレントディレクトリとして起動すること(mvnw spring-boot:run / mvnw test はこれを満たす)。
# SQLiteはDBファイルが存在しない場合、初回接続時に空のDBファイルを自動作成する。
# data/ は実行時データのため .gitignore でGit管理対象外としている。
spring.datasource.url=jdbc:sqlite:data/japanese_expression_learning.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLiteは単一ファイルDBであり、同時に書き込めるのは1接続のみ。
# 複数接続から同時に書き込むと「database is locked」エラーが起きやすいため、
# コネクションプール(HikariCP)の最大接続数を1に制限する。
# V1は単一利用者のローカル利用のため、1接続で性能上の問題はない。
spring.datasource.hikari.maximum-pool-size=1

# ============================================================
# JPA / Hibernate 設定
# ============================================================
# SQLite向けのSQLを生成させるためのDialect(hibernate-community-dialectsに含まれる)。
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Hibernateによるテーブルの自動作成・自動変更を行わない。
# DB設計書ではCHECK制約等をDB側で担保する方針のため、
# テーブル定義はHibernateの自動生成に任せず、下記の schema.sql で管理する。
spring.jpa.hibernate.ddl-auto=none

# ============================================================
# スキーマ初期化(schema.sql)設定
# ============================================================
# Spring Bootは既定ではH2等の組込みDBに対してのみ schema.sql を実行する。
# SQLiteは組込みDBとして判定されないため、always を指定して起動時に必ず実行させる。
# schema.sql は CREATE TABLE IF NOT EXISTS で記述しているため、毎回実行しても既存データは消えない。
spring.sql.init.mode=always
# schema.sql を読み込む文字コード。指定しない場合はOS既定(日本語Windowsでは MS932)となるため、
# UTF-8で保存しているSQLファイルを正しく読めるよう明示する。
spring.sql.init.encoding=UTF-8

# Controller処理中もDB接続を開いたままにするOpen Session In Viewを無効化する。
# 有効だと画面(API)側で意図しない遅延ロードSQLが発行されうるため、
# DBアクセスはService/Repository層の中で完結させる設計方針(詳細設計書 11章)に合わせる。
spring.jpa.open-in-view=false

# ============================================================
# JSON(Jackson)設定
# ============================================================
# JSONの数値をenumの定義順の番号として受け付けない。
# 既定では {"result": 1} が ReviewResult の1番目(INCORRECT)として受け付けられてしまうため、
# API-04 の result を設計どおり "CORRECT" / "INCORRECT" の文字列のみに限定する(数値は 400 となる)。
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
